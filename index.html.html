<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Estate Image Enhancer</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #1f4037, #99f2c8);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        width: 90%;
        max-width: 1000px;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #1f4037;
    }

    .upload-section {
        text-align: center;
        margin-bottom: 20px;
    }

    input[type="file"] {
        padding: 10px;
        margin-top: 10px;
    }

    .options {
        display: flex;
        justify-content: space-around;
        margin: 20px 0;
    }

    .options label {
        font-size: 15px;
    }

    button {
        display: block;
        margin: 20px auto;
        padding: 12px 25px;
        background: #1f4037;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #145c46;
    }

    .preview-section {
        display: flex;
        gap: 20px;
        margin-top: 20px;
    }

    .preview-box {
        flex: 1;
        text-align: center;
    }

    .preview-box img {
        width: 100%;
        max-height: 300px;
        object-fit: cover;
        border-radius: 8px;
        border: 2px solid #ddd;
    }

    .label {
        margin-bottom: 10px;
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Real Estate Image Enhancer</h1>

    <div class="upload-section">
        <label>Upload Property Image</label><br>
        <input type="file" accept="image/*">
    </div>

    <div class="options">
        <label><input type="checkbox"> Lighting Correction</label>
        <label><input type="checkbox"> Object Removal</label>
        <label><input type="checkbox"> Virtual Staging</label>
    </div>

    <button>Enhance Image</button>

    <div class="preview-section">
        <div class="preview-box">
            <div class="label">Original Image</div>
            <img src="https://via.placeholder.com/400x300?text=Original+Image" alt="Original">
        </div>

        <div class="preview-box">
            <div class="label">Enhanced Image</div>
            <img src="https://via.placeholder.com/400x300?text=Enhanced+Image" alt="Enhanced">
        </div>
    </div>

</div>

</body>
</html>
